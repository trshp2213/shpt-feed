spring:
  main:
    web-application-type: none   # CLI app – no embedded server

eurocart:
  # Store this as a GitHub Secret EUROCART_FEED_URL
  feed-url: ${EUROCART_FEED_URL}

deepl:
  # Store your DeepL API key as a GitHub Secret DEEPL_API_KEY
  # Free tier account: https://www.deepl.com/pro-api (500 000 chars/month)
  api-key: ${DEEPL_API_KEY}
  # Free tier API URL (use https://api.deepl.com for paid plan)
  api-url: https://api-free.deepl.com/v2/translate

azure:
  # GitHub Secrets: AZURE_TRANSLATOR_KEY + AZURE_TRANSLATOR_REGION (np. westeurope)
  # Tier F0: 2 000 000 znaków/miesiąc za darmo + throttling ~33 300 znaków/min
  # (osobny limit, pilnowany wewnętrznie przez AzureTranslatorProvider)
  api-key: ${AZURE_TRANSLATOR_KEY:}
  region: ${AZURE_TRANSLATOR_REGION:}
  endpoint: https://api.cognitive.microsofttranslator.com
  max-retries: 5

baselinker:
  # GitHub Secret: BASELINKER_TOKEN (Moje konto -> API w panelu BaseLinker).
  # Pusty token = sync BaseLinkera jest pomijany, feed Shoptet dziala normalnie.
  token: ${BASELINKER_TOKEN:}
  api-url: https://api.baselinker.com/connector.php
  # Opcjonalne: wymagane tylko gdy konto ma wiecej niz jeden katalog/magazyn
  inventory-id: ${BASELINKER_INVENTORY_ID:}
  warehouse-id: ${BASELINKER_WAREHOUSE_ID:}
  # Stan magazynowy wysylany dla produktow "Dostepny" (feed nie podaje sztuk).
  # 19 = ta sama umowna wartosc, ktora feed Shoptet wpisuje w STOCK VALUE.
  stock-when-available: 19
  # true = pipeline wysyla stany do magazynu bl_ (Vychozi/bl_64293).
  # WAZNE: integracje marketplace czytaja stan WYLACZNIE z magazynu Vychozi,
  # wiec to on musi miec stan produktow Carinio. Widoczna na karcie "Suma"
  # (Vychozi + abckociky.sk = 38) jest tylko kosmetyczna - dopoki zadna
  # integracja nie jest ustawiona na "sume magazynow", nic sie nie dubluje.
  # (Tak samo dziala reszta asortymentu, np. Bexa: 2 + 2, suma 4.)
  push-stock: true
  # false = pipeline NIE wysyla cen. Ceny per rynek ustawiasz w BaseLinkerze
  # jako grupy cenowe z mnoznikiem od ceny bazowej. UWAGA: baza w BL ("Vychozi")
  # jest nadpisywana przez sync ze Shoptetu wartoscia NETTO (element PRICE),
  # wiec mnozniki licz od netto (rynki EUR: x1.23).
  push-prices: false
  # Feed Carinio podaje ceny BRUTTO (sugerowana detaliczna) - NIE doliczamy nic.
  # vat-rate to procent doliczany do ceny z feedu przed konwersja walut (0 = cena 1:1 z feedu).
  vat-rate: 0
  # Stawka VAT deklarowana na produkcie w BL (zawarta w cenie brutto).
  tax-rate: 23
  # Odstep miedzy wywolaniami API (limit BaseLinkera: 100 req/min)
  request-interval-ms: 650

translation:
  source-lang: pl
  # Jezyk docelowy -> provider. Kolejnosc = priorytet przy ograniczonym budzecie.
  # sk zostaje na DeepL (cache w 100% istnieje), cs idzie na DeepL (zapas 500k),
  # reszta na Azure (2M/mies.)
  languages: "{sk: 'deepl', cs: 'deepl', hu: 'azure', de: 'azure', ro: 'azure', sl: 'azure', fr: 'azure', bg: 'azure'}"
  # Miesieczne budzety znakow per provider (z marginesem bezpieczenstwa
  # ponizej twardych limitow darmowych tierow: DeepL 500k, Azure 2M)
  monthly-limits: "{deepl: 480000, azure: 1900000}"

currency:
  # Waluty docelowe. Przy push-prices: false potrzebny jest juz tylko EUR
  # - do przeliczenia ceny PLN->EUR w feedzie Shoptet. Przeliczniki CZK/HUF/RON
  # robi BaseLinker (grupy cenowe z mnoznikiem), wiec nie pobieramy ich kursow.
  targets: EUR

output:
  feed-path: output/feed.xml
  cache-path: output/translation-cache.json

shoptet:
  # Stawka VAT sklepu (Slowacja: 23%) - uzywana do wyliczenia PRICE (netto)
  # z ceny brutto feedu; PRICE_VAT = cena brutto 1:1 z feedu.
  vat-rate: 23
  parent-category: "DOMÁCE ZVIERATÁ"
  currency: EUR
  vat: 20
  # Nadpisanie prekladov kategorii kde DeepL preklada nekonzistentne.
  # Kluc = co DeepL vrati (velke/male pismena su ignorovane pri porovnani)
  # Hodnota = spravny slovensky preklad
  category-overrides:
    "WÓZKI DLA ZWIERZĄT": "Vozíky pre zvieratá"
    "WÓZKI": "Vozíky pre zvieratá"
    "NOSIDEŁKA I TORBY": "Prepravné tašky pre zvieratá"
    "TORBY TRANSPORTOWE": "Prepravné tašky pre zvieratá"
    "TRANSPORTERY": "Prepravníky pre zvieratá"

logging:
  level:
    com.example.shoptetfeed: INFO

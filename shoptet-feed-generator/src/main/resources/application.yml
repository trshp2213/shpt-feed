spring:
  main:
    web-application-type: none   # CLI app – no embedded server

eurocart:
  # Store this as a GitHub Secret EUROCART_FEED_URL
  feed-url: ${EUROCART_FEED_URL}

deepl:
  # Store your DeepL API key as a GitHub Secret DEEPL_API_KEY
  # Free tier account: https://www.deepl.com/pro-api (500 000 chars/month)
  api-key: ${DEEPL_API_KEY}
  # Free tier API URL (use https://api.deepl.com for paid plan)
  api-url: https://api-free.deepl.com/v2/translate

output:
  feed-path: output/feed.xml
  cache-path: output/translation-cache.json

shoptet:
  parent-category: "DOMÁCE ZVIERATÁ"
  currency: EUR
  vat: 20
  # Nadpisanie prekladov kategorii kde DeepL preklada nekonzistentne.
  # Kluc = co DeepL vrati (velke/male pismena su ignorovane pri porovnani)
  # Hodnota = spravny slovensky preklad
  category-overrides:
    "WÓZKI DLA ZWIERZĄT": "Vozíky pre zvieratá"
    "WÓZKI": "Vozíky pre zvieratá"
    "NOSIDEŁKA I TORBY": "Prepravné tašky pre zvieratá"
    "TORBY TRANSPORTOWE": "Prepravné tašky pre zvieratá"
    "TRANSPORTERY": "Prepravníky pre zvieratá"

logging:
  level:
    com.example.shoptetfeed: INFO

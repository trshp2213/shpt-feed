name: Generate Shoptet Feed

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC (8:00 and 20:00 CET / 9:00 and 21:00 CEST)
    - cron: '0 6,18 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to commit feed.xml back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -q package -DskipTests

      - name: Generate feed
        env:
          EUROCART_FEED_URL: ${{ secrets.EUROCART_FEED_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: mvn -q spring-boot:run

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/feed.xml output/translation-cache.json
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "No changes to feed – skipping commit"
          else
            git commit -m "chore: update feed.xml [skip ci]"
            git push
          fi

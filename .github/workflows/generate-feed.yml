name: Generate Shoptet Feed

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shoptet-feed-generator   # <-- tu jest zmiana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -q package -DskipTests

      - name: Generate feed
        env:
          EUROCART_FEED_URL: ${{ secrets.EUROCART_FEED_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          BASELINKER_TOKEN: ${{ secrets.BASELINKER_TOKEN }}
        run: mvn -q spring-boot:run

      - name: Commit updated files
        working-directory: .   # git musi działać z roota repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shoptet-feed-generator/output/
          if git diff --staged --quiet; then
            echo "No changes – skipping commit"
          else
            git commit -m "chore: update feed.xml [skip ci]"
            git push
          fi

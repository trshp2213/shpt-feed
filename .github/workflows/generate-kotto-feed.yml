name: Generate Kotto Feed

on:
  schedule:
    - cron: '50 3,7,11,15,19,23 * * *'
  workflow_dispatch:

# nigdy dwa runy naraz (pierwszy run tłumaczy kilkanaście-kilkadziesiąt minut)
concurrency:
  group: kotto-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: shoptet-feed-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -q package -DskipTests

      - name: Generate Kotto feed
        env:
          SUPPLIER: kotto
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: mvn -q spring-boot:run -Dstart-class=com.example.supplierfeed.SupplierFeedApplication

      - name: Commit updated files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shoptet-feed-generator/output/kotto-*
          if git diff --staged --quiet; then
            echo "No changes – skipping commit"
          else
            git commit -m "chore: update kotto-feed.xml [skip ci]"
            git pull --rebase origin main
            git push
          fi

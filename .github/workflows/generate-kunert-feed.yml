name: Generate Kunert Feed

on:
  schedule:
    - cron: '35 */2 * * *'
  workflow_dispatch:

# nigdy dwa runy naraz (pierwszy run tłumaczy kilkanaście-kilkadziesiąt minut)
concurrency:
  group: kunert-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: shoptet-feed-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -q package -DskipTests

      - name: Diagnostyka połączenia z kunert.world
        continue-on-error: true
        working-directory: .
        run: |
          curl -sS -o /dev/null -m 60 -4 -w "IPv4: http=%{http_code} ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n" "https://kunert.world/xml-porownywarki/ceneo/?hash=zdefiniuj-haslo" || echo "IPv4: curl exit $?"
          curl -sS -o /dev/null -m 60 -6 -w "IPv6: http=%{http_code} ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n" "https://kunert.world/xml-porownywarki/ceneo/?hash=zdefiniuj-haslo" || echo "IPv6: curl exit $?"

      - name: Generate Kunert feed
        env:
          SUPPLIER: kunert
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: mvn -q spring-boot:run -Dstart-class=com.example.supplierfeed.SupplierFeedApplication

      - name: Commit updated files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shoptet-feed-generator/output/kunert-*
          if git diff --staged --quiet; then
            echo "No changes – skipping commit"
          else
            git commit -m "chore: update kunert-feed.xml [skip ci]"
            git pull --rebase origin main
            git push
          fi
